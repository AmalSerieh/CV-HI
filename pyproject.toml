[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-resume-analyzer"
version = "2.1.0"
description = "Canonical evidence-grounded resume analysis pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "jsonschema>=4.22,<5",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "pytesseract>=0.3.10,<0.4",
  "rapidfuzz>=3.9,<4",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30,<0.36",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "black>=24.4,<25.2",
  "flake8>=7,<8",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
  "httpx>=0.27,<1",
]
nlp = [
  "spacy>=3.7,<4",
  "sentence-transformers>=3,<6",
  "transformers>=4.44,<6",
]

[project.scripts]
resume-analyzer = "resume_analyzer.cli:main"
resume-analyzer-web = "resume_analyzer.web.app:main"
resume-analyzer-doctor = "resume_analyzer.diagnostics.environment:main"

[tool.setuptools]
py-modules = ["pipeline", "pipeline2"]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "ai*",
  "analyzers*",
  "ats*",
  "contracts*",
  "extractors*",
  "models1*",
  "resume_analyzer*",
  "schemas*",
]

[tool.setuptools.package-data]
resume_analyzer = [
  "schemas/*.json",
  "target_roles/data/*.json",
  "target_roles/data/*.md",
  "target_roles/sample_outputs/*.json",
  "target_roles/tests/cli_inputs/*.json",
  "target_roles/tests/fixtures/**/*.json",
  "web/templates/*.html",
  "web/templates/partials/*.html",
  "web/templates/components/*.html",
  "web/static/css/*.css",
  "web/static/js/*.js",
  "web/static/vendor/bootstrap/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "resume_analyzer/target_roles/tests"]
addopts = "-ra"
markers = ["integration: requires runtime document dependencies"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
(
  ^/resume_analyzer/extraction/(?!(__init__|backend|certifications|document_backend)\.py$)
  | ^/tests/test_cross_resume_regression_matrix\.py$
  | ^/tests/test_pdf_docx_parity_visual_templates\.py$
  | ^/tests/test_reporting_recommendation_polish\.py$
  | ^/tests/test_template_document_intelligence\.py$
)
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "tests/test_cross_resume_regression_matrix.py",
  "tests/test_pdf_docx_parity_visual_templates.py",
  "tests/test_reporting_recommendation_polish.py",
  "tests/test_template_document_intelligence.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
no_implicit_optional = true
follow_imports = "skip"
files = [
  "resume_analyzer/config.py",
  "resume_analyzer/environment.py",
  "resume_analyzer/diagnostics",
  "resume_analyzer/web/config.py",
]
exclude = "^(backups|ProjectResume-backups|outputs)/"

[[tool.mypy.overrides]]
module = ["fitz", "huggingface_hub", "jsonschema", "sentence_transformers", "spacy"]
ignore_missing_imports = true
